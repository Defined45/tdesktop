name: Build Telegram Desktop Windows (Docker)
on:
  workflow_dispatch: # Запуск кнопкой с телефона

jobs:
  build-win:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone tdesktop source
        uses: actions/checkout@v4
        with:
          repository: 'telegramdesktop/tdesktop'
          path: 'tdesktop'
          submodules: 'recursive'

      - name: Run Build inside Official Docker Container
        run: |
          cd tdesktop
          # Запускаем официальный контейнер Telegram для сборки под Windows
          docker run --rm \
            -v "$(pwd):/usr/src/tdesktop" \
            -w /usr/src/tdesktop \
            tdesktop/centos_env \
            bash -c "Configure.sh -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }} -D TDESKTOP_BUILD_PLATFORM=win64 && Ninja"

      - name: Upload Telegram.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-windows-x64
          path: tdesktop/out/Release/Telegram.exe
